<script>
let songs = [];
let currentIdx = -1;
let targetBPM = 170;
let finetune = 0;
const CORS_PROXY = 'https://corsproxy.io/?url=';
const bpmSlider = document.getElementById('bpmSlider');
bpmSlider.addEventListener('input', () => {
  targetBPM = parseInt(bpmSlider.value);
  document.getElementById('bpmValue').textContent = targetBPM;
  updatePace();
  updateSongList();
});
function updatePace() {
  const stride = 1.4;
  const speed = targetBPM * stride * 60 / 1000;
  const paceSec = 3600 / speed;
  const min = Math.floor(paceSec / 60);
  const sec = Math.round(paceSec % 60);
  document.getElementById('paceValue').textContent = min + "'" + String(sec).padStart(2,'0') + '"/km';
}
async function importPlaylist() {
  const url = document.getElementById('playlistUrl').value.trim();
  if (!url) return;
  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '解析中...';
  document.getElementById('emptyCard').innerHTML = '<div class="loading">正在解析歌单<span class="dots"></span></div>';
  try {
    const proxyUrl = CORS_PROXY + encodeURIComponent(url);
    const resp = await fetch(proxyUrl);
    const html = await resp.text();
    const result = parseQishuiHtml(html, url);
    if (result.songs.length === 0) throw new Error('未能解析出歌曲，请检查链接');
    songs = result.songs;
    renderPlaylist(result);
  } catch (e) {
    document.getElementById('emptyCard').style.display = 'block';
    document.getElementById('emptyCard').innerHTML = '<div class="error-msg">⚠️ ' + e.message + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '导入';
  }
}
function parseQishuiHtml(html, originalUrl) {
  let playlistName = '未知歌单';
  const nameMatch = html.match(/<meta[^>]+name="title"[^>]+content="([^"]+)"/);
  if (nameMatch) playlistName = decodeEntities(nameMatch[1]);
  let coverUrl = '';
  const coverMatch = html.match(/<meta[^>]+property="og:image"[^>]+content="([^"]+)"/);
  if (coverMatch) coverUrl = coverMatch[1];
  const texts = [];
  const regex = />([^<]{2,200})</g;
  let m;
  while ((m = regex.exec(html)) !== null) texts.push(m[1].trim());
  const skipPrefixes = ['汽水音乐','邀请你来','window.','function','var ','document','http','{"','/*','!function','baseScheme','isInWechat','force forbidden','Access to'];
  const parsedSongs = [];
  for (let i = 0; i < texts.length - 1; i++) {
    const t = texts[i];
    if (t.length < 2 || t.length > 100 || t.startsWith('{') || t.startsWith('//')) continue;
    if (skipPrefixes.some(p => t.startsWith(p))) continue;
    const next = texts[i + 1];
    if (next.includes(' • ')) {
      const parts = next.split(' • ');
      parsedSongs.push({ name: decodeEntities(t), artist: decodeEntities(parts[0].trim()), album: parts.length > 1 ? decodeEntities(parts.slice(1).join(' • ').trim()) : '', duration: '', bpm: null });
      i++;
    }
  }
  const trackIdMatches = html.match(/"id"\s*:\s*"(7\d{17,19})"/g) || [];
  const trackIds = trackIdMatches.map(m => m.match(/"(\d+)"/)[1]);
  const durMatches = html.match(/"duration"\s*:\s*(\d+)\s*,\s*"name"/g) || [];
  for (let i = 0; i < parsedSongs.length; i++) {
    if (i < trackIds.length) parsedSongs[i].track_id = trackIds[i];
    if (i < durMatches.length) {
      const durMs = parseInt(durMatches[i].match(/(\d+)/)[1]);
      parsedSongs[i].duration = Math.floor(durMs/60000) + ':' + String(Math.floor((durMs%60000)/1000)).padStart(2,'0');
    }
  }
  return { name: playlistName, cover: coverUrl, songs: parsedSongs, platform: 'qishui', song_count: parsedSongs.length };
}
function decodeEntities(s) { const d = document.createElement('div'); d.innerHTML = s; return d.textContent || s; }
function renderPlaylist(data) {
  document.getElementById('emptyCard').style.display = 'none';
  document.getElementById('playlistCard').style.display = 'block';
  document.getElementById('playlistName').textContent = data.name || '未知歌单';
  document.getElementById('playlistCount').textContent = (data.song_count || songs.length) + ' 首歌曲 · 汽水音乐';
  const cover = document.getElementById('playlistCover');
  if (data.cover) { cover.src = data.cover; cover.style.display = 'block'; } else { cover.style.display = 'none'; }
  document.getElementById('playHint').innerHTML = '💡 点击歌曲可在汽水音乐中播放 · 变速功能开发中';
  updateStats();
  updateSongList();
}
function updateStats() {
  const high = songs.filter(s => { const bpm = s.bpm || estimateBPM(s.name, s.artist); return calcMatch(bpm, targetBPM) >= 90; }).length;
  const avgMatch = Math.round(songs.reduce((sum, s) => sum + calcMatch(s.bpm || estimateBPM(s.name, s.artist), targetBPM), 0) / songs.length);
  document.getElementById('statHigh').textContent = high;
  document.getElementById('statAvg').textContent = avgMatch + '%';
  document.getElementById('statSongs').textContent = songs.length;
  document.getElementById('statsBar').style.display = 'flex';
}
function updateSongList() {
  const list = document.getElementById('songList');
  const sorted = songs.map((s, origIdx) => ({...s, origIdx})).sort((a, b) => calcMatch(b.bpm || estimateBPM(b.name, b.artist), targetBPM) - calcMatch(a.bpm || estimateBPM(a.name, a.artist), targetBPM));
  list.innerHTML = sorted.map(s => {
    const i = s.origIdx;
    const isCurrent = i === currentIdx;
    const origBPM = s.bpm || estimateBPM(s.name, s.artist);
    const matchPct = calcMatch(origBPM, targetBPM);
    const matchClass = matchPct >= 90 ? 'high' : matchPct >= 70 ? 'mid' : 'low';
    const playIcon = isCurrent ? '<div class="song-playing-icon"><span></span><span></span><span></span><span></span></div>' : '<div class="song-num">' + (i + 1) + '</div>';
    return '<div class="song-item ' + (isCurrent ? 'playing' : '') + '" onclick="selectSong(' + i + ')">' + playIcon + '<div class="song-info"><div class="song-name">' + escapeHtml(s.name) + '</div><div class="song-artist">' + escapeHtml(s.artist) + (s.duration ? ' · ' + s.duration : '') + '</div></div><div class="song-bpm"><div><span class="original">' + origBPM + '</span><span class="arrow">→</span><span class="target">' + targetBPM + '</span></div><span class="match-badge match-' + matchClass + '">' + matchPct + '%</span></div></div>';
  }).join('');
}
function estimateBPM(name, artist) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) { hash = ((hash << 5) - hash) + name.charCodeAt(i); hash |= 0; }
  return 60 + (Math.abs(hash) % 120);
}
function calcMatch(origBPM, targetBPM) {
  const d1 = Math.abs(origBPM - targetBPM);
  const d2 = Math.abs(origBPM * 2 - targetBPM);
  const d3 = Math.abs(origBPM / 2 - targetBPM);
  return Math.max(0, Math.round(100 - Math.min(d1, d2, d3) / Math.max(targetBPM, origBPM) * 100));
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function selectSong(idx) {
  if (idx < 0 || idx >= songs.length) return;
  currentIdx = idx;
  const song = songs[idx];
  document.getElementById('currentSongName').textContent = song.name;
  document.getElementById('currentSongArtist').textContent = ' · ' + song.artist;
  document.getElementById('playerBar').style.display = 'block';
  updateSongList();
}
function togglePlay() {
  if (currentIdx < 0) return;
  const song = songs[currentIdx];
  if (song.track_id) window.open('https://music.douyin.com/qishui/share/song?song_id=' + song.track_id, '_blank');
}
function prevSong() { if (currentIdx > 0) selectSong(currentIdx - 1); }
function nextSong() { if (currentIdx < songs.length - 1) selectSong(currentIdx + 1); }
function updateFinetune() {
  finetune = parseInt(document.getElementById('finetuneSlider').value);
  document.getElementById('finetuneVal').textContent = (finetune > 0 ? '+' : '') + finetune + '%';
}
updatePace();
</script>
</body>
</html>
